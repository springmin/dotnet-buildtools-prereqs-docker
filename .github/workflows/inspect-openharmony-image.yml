name: Inspect OpenHarmony image size

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_IMAGE: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-4.0-net12.0-crossdeps-llvm-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        working-directory: src/azurelinux/4.0/net12.0/cross/openharmony/6.0/amd64
        run: |
          docker build --progress=plain \
            --build-arg OHOS_SDK_URL=https://repo.huaweicloud.com/openharmony/os/6.0-Release/ohos-sdk-windows_linux-public.tar.gz \
            --build-arg OPENSSL_URL=https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz \
            --build-arg ICU_URL=https://github.com/unicode-org/icu/releases/download/release-75-1/icu4c-75_1-src.tgz \
            -t ohos-inspect ./

      - name: Record image sizes
        run: |
          echo '== final inspect =='
          docker image inspect --format 'final.Size={{.Size}}' ohos-inspect
          echo '== base inspect =='
          docker image inspect --format 'base.Size={{.Size}}' "$BASE_IMAGE"
          echo '== final top dirs =='
          docker run --rm ohos-inspect du -sh /opt/ohos-sdk/linux/native /opt/ohos-assets /opt/ohos-toolchain /usr /usr/local
          echo '== base top dirs =='
          docker run --rm "$BASE_IMAGE" du -sh /usr /usr/local 2>/dev/null || true
          echo '== final history =='
          docker history --no-trunc --format '{{.ID}}\t{{.Size}}\t{{.CreatedBy}}' ohos-inspect > /tmp/final-history.txt
          cat /tmp/final-history.txt
          echo '== final history size sum =='
          awk -F '\t' '{print $2}' /tmp/final-history.txt | sed 's/GB/*1024*1024*1024/;s/MB/*1024*1024/;s/kB/*1024/;s/B//' | bc 2>/dev/null | awk '{s+=$1} END {printf "history_approx_bytes=%d\n",s}' || true

      - name: Docker save sizes
        run: |
          echo '== uncompressed docker save bytes =='
          docker save ohos-inspect | wc -c
          echo '== gzip-compressed docker save bytes =='
          docker save ohos-inspect | gzip -1 | wc -c
