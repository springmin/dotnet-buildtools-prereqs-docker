name: Validate OpenHarmony image

on:
  push:
    branches:
      - validate/1786-openharmony-opt
  workflow_dispatch:
    inputs:
      ohos_sdk_url:
        description: OpenHarmony SDK tarball URL
        required: false
        default: https://repo.huaweicloud.com/openharmony/os/6.0-Release/ohos-sdk-windows_linux-public.tar.gz
      openssl_url:
        description: OpenSSL tarball URL
        required: false
        default: https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz
      icu_url:
        description: ICU tarball URL
        required: false
        default: https://github.com/unicode-org/icu/releases/download/release-75-1/icu4c-75_1-src.tgz
      runtime_ref:
        description: runtime-ohos branch to build with the image
        required: false
        default: validate/ohos-image-runtime
      sdk_ref:
        description: sdk-ohos branch to build with the image
        required: false
        default: feature/openharmony
      aspnetcore_ref:
        description: aspnetcore-ohos branch to build with the image
        required: false
        default: feature/openharmony
      run_sdk:
        description: Also run the full SDK build (slow)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build image and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OHOS_SDK_URL: ${{ inputs.ohos_sdk_url || 'https://repo.huaweicloud.com/openharmony/os/6.0-Release/ohos-sdk-windows_linux-public.tar.gz' }}
      OPENSSL_URL: ${{ inputs.openssl_url || 'https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz' }}
      ICU_URL: ${{ inputs.icu_url || 'https://github.com/unicode-org/icu/releases/download/release-75-1/icu4c-75_1-src.tgz' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker version

      - name: Build image
        working-directory: src/azurelinux/4.0/net12.0/cross/openharmony/6.0/amd64
        run: |
          docker build --progress=plain \
            --build-arg OHOS_SDK_URL="$OHOS_SDK_URL" \
            --build-arg OPENSSL_URL="$OPENSSL_URL" \
            --build-arg ICU_URL="$ICU_URL" \
            -t ohos-test .

      - name: Smoke test image
        run: |
          docker run --rm ohos-test sh -c '
            test -x /opt/ohos-sdk/linux/native/llvm/bin/clang &&
            test -f /opt/ohos-assets/openssl/lib/libssl.a &&
            test -f /opt/ohos-assets/icu/lib/libicuuc.a &&
            echo OK'

      - name: Record image size
        run: |
          docker image inspect --format 'image_size_bytes={{.Size}}' ohos-test
          docker run --rm ohos-test du -sh \
            /opt/ohos-sdk/linux/native \
            /opt/ohos-assets \
            /opt/ohos-toolchain

      - name: Check out runtime source
        uses: actions/checkout@v4
        with:
          repository: springmin/runtime-ohos
          ref: ${{ inputs.runtime_ref || 'validate/ohos-image-runtime' }}
          path: runtime-src

      - name: Check out aspnetcore source
        if: ${{ inputs.run_sdk == true }}
        uses: actions/checkout@v4
        with:
          repository: springmin/aspnetcore-ohos
          ref: ${{ inputs.aspnetcore_ref || 'feature/openharmony' }}
          path: aspnet-src
          submodules: recursive

      - name: Check out SDK source
        if: ${{ inputs.run_sdk == true }}
        uses: actions/checkout@v4
        with:
          repository: springmin/sdk-ohos
          ref: ${{ inputs.sdk_ref || 'feature/openharmony' }}
          path: sdk-src

      - name: Seed host .NET SDKs
        if: ${{ inputs.run_sdk == true }}
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          for d in runtime-src aspnet-src sdk-src; do
            /tmp/dotnet-install.sh --version 11.0.100-preview.6.26359.118 --install-dir "$GITHUB_WORKSPACE/$d/.dotnet" --no-path
          done
          for d in runtime-src aspnet-src sdk-src; do
            /tmp/dotnet-install.sh --version 11.0.100-rc.1.26420.103 --install-dir "$GITHUB_WORKSPACE/$d/.dotnet" --no-path
            /tmp/dotnet-install.sh --version 11.0.100-rc.1.26425.128 --install-dir "$GITHUB_WORKSPACE/$d/.dotnet" --no-path
          done

      - name: Build runtime native libraries with the image
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/runtime-src:/work" \
            -w /work \
            -e CI=true \
            ohos-test \
            bash -c './build.sh clr.runtime+libs.native -os openharmony -arch arm64 -cross -c Release -cmakeargs "$OHOS_CMAKE_ARGS"'

      - name: Build full SDK with the image
        if: ${{ inputs.run_sdk == true }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/runtime-src:/work/runtime" \
            -v "$GITHUB_WORKSPACE/aspnet-src:/work/aspnetcore" \
            -v "$GITHUB_WORKSPACE/sdk-src:/work/sdk" \
            -e OHOS_NDK_HOME=/opt/ohos-sdk/linux \
            -e OPENSSL_DIR=/opt/ohos-assets/openssl \
            -e ICU_DIR=/opt/ohos-assets/icu \
            -e RUNTIME_REPO=/work/runtime \
            -e ASCORE_REPO=/work/aspnetcore \
            -e SDK_REPO=/work/sdk \
            -e BUILDID=20260901.109 \
            -e ALLOW_UNVERIFIED=1 \
            ohos-test \
            bash -c 'warn_echo() { printf "%s\n" "$*" >&2; }; export -f warn_echo; bash /work/sdk/eng/ohos-install/build/build-ohos-all.sh --arch=arm64 --rid=openharmony-arm64 --config=Release --buildid=20260901.109'
          test -n "$(find "$GITHUB_WORKSPACE/sdk-src/artifacts/packages/Release/Shipping" -maxdepth 1 -name 'dotnet-sdk-*-openharmony-arm64.tar.gz' -print -quit)"
