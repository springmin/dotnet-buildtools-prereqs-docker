name: Validate integrated OpenHarmony SDK and ASP.NET Core

on:
  push:
    branches:
      - validate/integration-components
  workflow_dispatch:
    inputs:
      target:
        description: Component to validate
        type: choice
        options:
          - all
          - sdk
          - aspnetcore
        default: all

permissions:
  contents: read

jobs:
  setup:
    name: Select validation targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Select targets
        id: set
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            sdk|aspnetcore) echo "matrix={\"target\":[\"$TARGET\"]}" >> "$GITHUB_OUTPUT" ;;
            *) echo 'matrix={"target":["sdk","aspnetcore"]}' >> "$GITHUB_OUTPUT" ;;
          esac

  validate:
    name: Validate ${{ matrix.target }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build OpenHarmony image
        working-directory: src/azurelinux/4.0/net12.0/cross/openharmony/6.0/amd64
        run: |
          docker build --progress=plain \
            --build-arg OHOS_SDK_URL=https://repo.huaweicloud.com/openharmony/os/6.0-Release/ohos-sdk-windows_linux-public.tar.gz \
            --build-arg OPENSSL_URL=https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz \
            --build-arg ICU_URL=https://github.com/unicode-org/icu/releases/download/release-75-1/icu4c-75_1-src.tgz \
            -t ohos-integration ./

      - name: Check out SDK source
        if: matrix.target == 'sdk'
        uses: actions/checkout@v4
        with:
          repository: springmin/sdk-ohos
          ref: feature/openharmony
          path: sdk-src

      - name: Check out SDK build helper
        if: matrix.target == 'sdk'
        uses: actions/checkout@v4
        with:
          repository: springmin/sdk-ohos
          ref: validate/ohos-image-sdk-only
          path: sdk-tools

      - name: Seed SDK bootstrap
        if: matrix.target == 'sdk'
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          for v in 11.0.100-preview.6.26359.118 11.0.100-rc.1.26420.103 11.0.100-rc.1.26425.128; do
            /tmp/dotnet-install.sh --version "$v" --install-dir "$GITHUB_WORKSPACE/sdk-src/.dotnet" --no-path
          done

      - name: Build integrated SDK
        if: matrix.target == 'sdk'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/sdk-src:/work/sdk" \
            -v "$GITHUB_WORKSPACE/sdk-tools:/work/sdk-tools" \
            -e SDK_REPO=/work/sdk \
            -e OHOS_NDK_HOME=/opt/ohos-sdk/linux \
            -e OPENSSL_DIR=/opt/ohos-assets/openssl \
            -e ICU_DIR=/opt/ohos-assets/icu \
            ohos-integration \
            bash -c '
              mkdir -p /work/sdk/eng/ohos-install/build
              cp /work/sdk-tools/eng/ohos-install/build/build-ohos-sdk-image.sh \
                 /work/sdk/eng/ohos-install/build/
              bash /work/sdk/eng/ohos-install/build/build-ohos-sdk-image.sh'
          test -x "$GITHUB_WORKSPACE/sdk-src/artifacts/bin/redist/Release/dotnet/dotnet"

      - name: Check out ASP.NET Core source
        if: matrix.target == 'aspnetcore'
        uses: actions/checkout@v4
        with:
          repository: springmin/aspnetcore-ohos
          ref: feature/openharmony
          path: aspnet-src
          submodules: recursive

      - name: Seed ASP.NET Core bootstrap
        if: matrix.target == 'aspnetcore'
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          chmod +x /tmp/dotnet-install.sh
          /tmp/dotnet-install.sh --version 11.0.100-rc.3.26522.148 \
            --install-dir "$GITHUB_WORKSPACE/aspnet-src/.dotnet" --no-path

      - name: Prepare OpenHarmony RID graph
        if: matrix.target == 'aspnetcore'
        run: |
          set -euo pipefail
          sdk_dir="$GITHUB_WORKSPACE/aspnet-src/.dotnet/sdk/11.0.100-rc.3.26522.148"
          mkdir -p "$GITHUB_WORKSPACE/ohos-rid"
          python3 - "$sdk_dir/PortableRuntimeIdentifierGraph.json" "$GITHUB_WORKSPACE/ohos-rid/PortableRuntimeIdentifierGraph.json" <<'PY'
          import json
          import sys

          source, dest = sys.argv[1], sys.argv[2]
          with open(source, encoding="utf-8") as stream:
              graph = json.load(stream)

          runtimes = graph["runtimes"]
          runtimes["openharmony"] = {"#import": ["any"]}
          runtimes["openharmony-arm"] = {"#import": ["openharmony"]}
          runtimes["openharmony-arm64"] = {"#import": ["openharmony"]}
          runtimes["openharmony-x64"] = {"#import": ["openharmony"]}
          graph["runtimes"] = dict(sorted(runtimes.items()))

          with open(dest, "w", encoding="utf-8") as stream:
              json.dump(graph, stream, indent=2)
              stream.write("\n")
          PY

      - name: Build integrated ASP.NET Core
        if: matrix.target == 'aspnetcore'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/aspnet-src:/work" \
            -v "$GITHUB_WORKSPACE/ohos-rid:/work/ohos-rid:ro" \
            -w /work \
            -e CI=true \
            ohos-integration \
            bash -c './eng/build.sh -c Release --no-build-nodejs -p:RuntimeIdentifierGraphPath=/work/ohos-rid/PortableRuntimeIdentifierGraph.json -p:BundledToolTargetRuntimeIdentifiers=linux-x64 -p:NativeAotSupported=false'
